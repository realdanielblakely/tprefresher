[platformio]
default_envs = usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI
  paulstoffregen/XPT2046_Touchscreen
  bblanchon/ArduinoJson
build_flags =
  -D USER_SETUP_LOADED=1
  -include include/tft_setup.h

; First flash, and any recovery flash, over the USB cable.
[env:usb]
upload_protocol = esptool

; Updates over Wi-Fi. Needs OTA_PASSWORD exported to match secrets.h.
[env:ota]
upload_protocol = espota
upload_port = tprefresher.local
upload_flags = --auth=${sysenv.OTA_PASSWORD}
