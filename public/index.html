<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163b35">
  <title>TP Refresher</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div><p class="eyebrow">CLOSET STATUS BOARD</p><h1>Toilet paper check</h1></div>
      <span id="connection" class="connection">Connecting...</span>
    </header>
    <p class="intro">Tap a bathroom when it needs a fresh roll.</p>
    <section id="bathrooms" class="cards" aria-live="polite"></section>
    <p id="error" class="error" role="alert"></p>
    <footer>Updates are shared with the closet display.</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
